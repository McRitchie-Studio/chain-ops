name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: redis
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      # NO google-chrome-stable. This job used to install a full browser and then run
      # `test:system` against a `test/system` directory holding exactly one file: `.keep`.
      # It certified nothing and charged every chain-ops PR for the privilege. The
      # emptiness is a CHECKED fact, not an assumption — see the guard in
      # test/lib/ci_system_lane_test.rb, which globs this repo's own tree and rides inside
      # the very `bin/rails ... test` invocation below.
      #
      # WHEN A SYSTEM TEST LANDS, PUT THE LANE BACK. All of it, together: `test:system`
      # back on the suite command, google-chrome-stable back on this line, the screenshot
      # upload back at the end of this job, and SUITE_SCRIPT re-pointed in that guard. The
      # guard goes red the moment test/system stops being empty and names the file that did
      # it, which is the whole reason removing this is safe rather than merely cheaper.
      #
      # Ported from turf-monster (/tasks/drop-turf-empty-system-lane, its PR 365), which
      # was in this exact state — empty tier, full browser, every PR paying for both.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y curl libjemalloc2 postgresql-client

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # `db:test:prepare test` — the SYSTEM tier is gone, with the browser above. ONLY
      # `test:system` left this line: the model, controller, service and integration tiers
      # all still ride the `test` task, which globs test/**/*_test.rb minus test/system.
      #
      # Keep db:test:prepare FIRST. `test` is a real rails COMMAND, so a rails-command first
      # arg would parse the rest of the line as PATHS; a leading non-command routes the whole
      # line through RAKE, where each token is a task. It is also what fires Rails' own
      # `test:prepare` hook, and the hook is skipped the moment any argument looks like a path.
      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

      # NO screenshot upload. `tmp/screenshots` is written by Rails SYSTEM tests and by
      # nothing else in this repo, so the step went with the tier it served. The guard
      # asserts this too, in BOTH directions: capture that outlives its tier is a job
      # paying for a lane nobody runs, and a restored tier with no capture is a system
      # failure you cannot see. Restore them together or not at all.
